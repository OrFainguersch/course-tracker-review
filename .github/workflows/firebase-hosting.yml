name: Deploy FLYMPUS to Firebase Hosting

# Enable automatic main deployments after the first verified production release.
# Until deployment authorization is connected, this is explicitly on demand.
on:
  workflow_dispatch:

concurrency:
  group: flympus-firebase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify application before production deployment
        run: node --test tests/*.test.cjs
      - name: Confirm deployment authorization is configured
        env:
          WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          HAS_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLYMPUS != '' }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo 'Keyless deployment authorization is configured.'
          elif [ "$HAS_DEPLOY_KEY" = 'true' ]; then
            echo 'Firebase deployment authorization is configured.'
          else
            echo '::error::Connect Firebase deployment authorization before running this workflow.'
            exit 1
          fi
      - name: Authenticate with short-lived GitHub identity
        if: vars.FIREBASE_WIF_PROVIDER != '' && vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: flympus
      - name: Authenticate with Firebase deployment account
        if: vars.FIREBASE_WIF_PROVIDER == '' || vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT == ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLYMPUS }}
          project_id: flympus
      - name: Deploy reviewed public bundle to Firebase Hosting
        run: npx --yes firebase-tools@15.32.1 deploy --only hosting --project flympus --non-interactive
      - name: Verify production commit, assets and reserved auth helpers
        run: node scripts/verify-hosting.cjs
