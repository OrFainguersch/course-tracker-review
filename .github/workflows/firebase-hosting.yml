name: Deploy FLYMPUS to Firebase Hosting

# Production Hosting is verified. Only the newest main commit is eligible to
# verify/deploy. Obsolete or verification-failing revisions exit successfully
# without touching production, preventing transient multi-file work from sending
# repeated GitHub "workflow failed" emails. Real deployment/auth failures remain fatal.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flympus-firebase-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Debounce and discard obsolete main revisions
        id: freshness
        shell: bash
        run: |
          echo "current=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            sleep 45
            git fetch origin main --quiet
            latest="$(git rev-parse origin/main)"
            if [ "$latest" != "$GITHUB_SHA" ]; then
              echo "::notice::A newer main revision exists. This obsolete run exits successfully without verification or deployment."
              echo "current=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          node-version: 22
      - name: Verify application before production deployment
        id: app_verify
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          if node --test tests/*.test.cjs; then
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Application verification failed. Production remains unchanged. This guarded run exits successfully to avoid transient failure-email spam."
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verification safely skipped deployment
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready != 'true'
        run: echo "::notice::FLYMPUS was not deployed because verification did not pass. Production remains unchanged."
      - name: Confirm deployment authorization is configured
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true'
        env:
          WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo '::error::Configure the verified WIF provider and dedicated Hosting service account repository variables.'
            exit 1
          fi
      - name: Install pinned Firebase CLI
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true'
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-audit --no-fund firebase-tools@15.32.1
      - name: Verify pinned CLI ADC and WIF compatibility
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true'
        run: node scripts/test-firebase-wif.cjs "$RUNNER_TEMP/firebase-cli/node_modules/firebase-tools"
      - name: Authenticate with short-lived GitHub identity
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: flympus
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify real ADC access to the Hosting site
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true'
        run: node "$RUNNER_TEMP/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js" hosting:sites:get flympus --project flympus --non-interactive
      - name: Deploy reviewed Firestore access rules
        id: rules_deploy
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true'
        continue-on-error: true
        run: node scripts/deploy-firestore-rules.cjs "$RUNNER_TEMP/firebase-cli/node_modules/firebase-tools"
      - name: Report Firestore Rules deployment status
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true'
        shell: bash
        run: |
          if [ "${{ steps.rules_deploy.outcome }}" = "success" ]; then
            echo "::notice::Firestore Rules deployed successfully."
          else
            echo "::warning::Firestore Rules were not deployed. Hosting is intentionally left unchanged to avoid a UI/security-rule mismatch."
          fi
      - name: Deploy reviewed public bundle to Firebase Hosting
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true' && steps.rules_deploy.outcome == 'success'
        run: node "$RUNNER_TEMP/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js" deploy --only hosting --project flympus --non-interactive
      - name: Verify production commit, assets and reserved auth helpers
        if: steps.freshness.outputs.current == 'true' && steps.app_verify.outputs.deploy_ready == 'true' && steps.rules_deploy.outcome == 'success'
        run: node scripts/verify-hosting.cjs
