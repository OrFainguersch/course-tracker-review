name: Verify FLYMPUS review

# Complete regression checks remain email-quiet; inspect the explicit summary
# and actual test outcome before merging. A green icon alone is not approval.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: flympus-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete application regression suite
        id: regression
        continue-on-error: true
        run: node --test tests/*.test.cjs
      - name: Review verification summary
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        shell: bash
        run: |
          if [ "$REGRESSION_OUTCOME" = "success" ]; then
            echo "::notice::All FLYMPUS review checks passed."
            echo "### Review verification: PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo "All tests passed for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::One or more FLYMPUS review checks did not pass."
            echo "### Review verification: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Actual regression outcome: $REGRESSION_OUTCOME. Inspect the test log before merging." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read-only production source and public asset audit
        id: hosting_audit
        if: startsWith(github.head_ref, 'fix/firebase-safe-release-')
        continue-on-error: true
        env:
          FLYMPUS_AUDIT_DIRECTORY: ${{ runner.temp }}/flympus-hosting-audit
        run: node scripts/audit-live-hosting.cjs
      - name: Preserve public Hosting audit evidence
        if: steps.hosting_audit.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verified-public-hosting-audit
          path: ${{ runner.temp }}/flympus-hosting-audit
