name: Verify FLYMPUS review

# Verification is intentionally NOT triggered by direct pushes to main.
# The review site is updated directly on main, and frequent incremental pushes
# previously created transient failed runs and duplicate GitHub email alerts.
# Verification remains available for pull requests and on-demand manual runs.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: flympus-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Training core tests
        run: node tests/training-core.test.cjs
      - name: UI render smoke tests
        run: node tests/ui-render.test.cjs
