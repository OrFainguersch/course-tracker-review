name: Verify FLYMPUS review

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flympus-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Training core tests
        run: node tests/training-core.test.cjs
      - name: UI render smoke tests
        run: node tests/ui-render.test.cjs
