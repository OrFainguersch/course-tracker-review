name: Verify FLYMPUS review

# Verification is intentionally NOT triggered by direct pushes to main.
# The review site is updated directly on main, and frequent incremental pushes
# previously created transient failed runs and duplicate GitHub email alerts.
# Verification remains available for pull requests and on-demand manual runs.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: flympus-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Training core tests
        run: node tests/training-core.test.cjs
      - name: UI render smoke tests
        run: node tests/ui-render.test.cjs
      - name: iOS audio lifecycle tests
        run: node tests/ios-audio-lifecycle.test.cjs
      - name: Web Push integration tests
        run: node tests/push-notifications.test.cjs
      - name: Firebase reserved route runtime tests
        run: node --test tests/sw-routing.test.cjs
      - name: Authentication foundation tests
        run: node tests/auth-integration.test.cjs
      - name: Authentication lifecycle regression tests
        run: node --test tests/auth-lifecycle.test.cjs
      - name: First paint and resume theme tests
        run: node --test tests/theme-controller.test.cjs
      - name: UID-scoped storage tests
        run: node tests/storage-scope.test.cjs
      - name: Hebrew UI and RTL tests
        run: node tests/hebrew-ui.test.cjs
      - name: Hebrew i18n integration tests
        run: node tests/i18n.test.cjs
