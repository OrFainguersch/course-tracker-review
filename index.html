const flympusBottomScreenTemplates=new Map();
let flympusBottomScreenPrewarmHandle=null;
const FLYMPUS_BOTTOM_ROOT_SCREENS=['roster','planned','home','record','reports'];

function buildFlympusScreenHtml(screen){
  let html='';
  switch(screen){
    case'courses':html=myCourses();break;
    case'home':html=home();break;
    case'record':html=recordHub();break;
    case'evaluation':html=evaluation();break;
    case'roster':html=roster();break;
    case'profile':html=traineeProfile();break;
    case'instructor':html=instructorProfile();break;
    case'settings':html=settings();break;
    case'preferences':html=appPreferencesScreen();break;
    case'reports':html=reports();break;
    case'safety':html=safetyScreen();break;
    case'exams':html=examsScreen();break;
    case'planned':html=plannedVsExecuted();break;
    default:html=home();break;
  }
  if(screen!=='home')html=globalBackControl()+html;
  return html;
}

function createFlympusScreenTemplate(screen){
  const previous=state.screen;
  try{
    state.screen=screen;
    const html=buildFlympusScreenHtml(screen);
    const tpl=document.createElement('template');
    tpl.innerHTML=html;
    flympusBottomScreenTemplates.set(screen,tpl);
    return tpl;
  }catch(err){
    try{console.warn('FLYMPUS pre-render skipped',screen,err)}catch{}
    return null;
  }finally{
    state.screen=previous;
  }
}

function invalidateFlympusBottomScreenTemplates(){
  flympusBottomScreenTemplates.clear();
  if(flympusBottomScreenPrewarmHandle!=null){
    try{
      if(typeof cancelIdleCallback==='function')cancelIdleCallback(flympusBottomScreenPrewarmHandle);
      else clearTimeout(flympusBottomScreenPrewarmHandle);
    }catch{}
    flympusBottomScreenPrewarmHandle=null;
  }
}

function prewarmFlympusBottomScreens(){
  if(flympusBottomScreenPrewarmHandle!=null)return;
  const queue=FLYMPUS_BOTTOM_ROOT_SCREENS.filter(screen=>screen!==state.screen);
  const step=deadline=>{
    flympusBottomScreenPrewarmHandle=null;
    const screen=queue.shift();
    if(screen&&!flympusBottomScreenTemplates.has(screen))createFlympusScreenTemplate(screen);
    if(!queue.length)return;
    const schedule=()=>{
      if(typeof requestIdleCallback==='function'){
        flympusBottomScreenPrewarmHandle=requestIdleCallback(step,{timeout:450});
      }else{
        flympusBottomScreenPrewarmHandle=setTimeout(()=>step({timeRemaining:()=>8}),24);
      }
    };
    if(deadline?.timeRemaining?.()>5)step(deadline);
    else schedule();
  };
  if(typeof requestIdleCallback==='function'){
    flympusBottomScreenPrewarmHandle=requestIdleCallback(step,{timeout:350});
  }else{
    flympusBottomScreenPrewarmHandle=setTimeout(()=>step({timeRemaining:()=>8}),24);
  }
}

function mountFlympusFastScreen(screen){
  const root=$('#content');
  if(!root)return false;
  const tpl=flympusBottomScreenTemplates.get(screen);
  if(!tpl)return false;
  root.replaceChildren(tpl.content.cloneNode(true));
  return true;
}

  document.body?.classList.remove('flympusPersonModalOpen');

function cleanupMountedPersonEditModal(){

function mountPersonEditModal(){

function renderPreservingManagementView(update){
  const root=$('#content'),docEl=document.documentElement,body=document.body,scrollTop=Number(window.scrollY||docEl?.scrollTop||body?.scrollTop||0),openStates=root?[...root.querySelectorAll('details')].map(x=>!!x.open):[];

  anchorNodes.forEach((el,i)=>{const r=el.getBoundingClientRect?.();if(!r||r.height<=0||r.bottom<=viewportTop)return;const score=r.top<=viewportTop?viewportTop-r.top:10000+(r.top-viewportTop);if(!best||score<best.score)best={i,top:r.top,score}});

        if(rect&&Number.isFinite(rect.top)){const delta=rect.top-anchorTop;if(Math.abs(delta)>.25){if(typeof window.scrollBy==='function')window.scrollBy(0,delta);else if(docEl)docEl.scrollTop+=delta}}
      }
    }catch{}
  };
  restore();
  if(typeof window.requestAnimationFrame==='function')window.requestAnimationFrame(()=>{restore();window.requestAnimationFrame(()=>{restore();try{if(docEl?.style)docEl.style.overflowAnchor=oldHtmlAnchor||'';if(body?.style)body.style.overflowAnchor=oldBodyAnchor||''}catch{}})});

function bindGlobalFormUx(){
  document.querySelectorAll('input[type="number"]').forEach(el=>{
    el.addEventListener('focus',()=>{if(String(el.value)==='0')setTimeout(()=>{try{el.select()}catch{}},0)});
    el.addEventListener('input',()=>{const v=String(el.value);if(/^0\d+/.test(v))el.value=v.replace(/^0+(?=\d)/,'')});
  });
  document.querySelectorAll('.field').forEach(field=>{
    const control=field.querySelector('input[required],select[required],textarea[required]');
    const label=field.querySelector('label');
    if(control&&label&&!label.querySelector('.requiredStar'))label.insertAdjacentHTML('beforeend','<span class="requiredStar">*</span>');
  });
  document.querySelectorAll('form').forEach(form=>{
    form.noValidate=true;
    form.addEventListener('submit',e=>{if(showFormInvalid(form)){e.preventDefault();e.stopImmediatePropagation()}},true)

    state.profileDraftType=type;
    $('#cfgProfilePhase').disabled=false;$('#cfgProfilePhase').innerHTML='<option value="" selected disabled>Select phase</option>'+ph.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
    const checks=(name,list,extra)=>'<div class="criteria">'+list.map(x=>'<label class="criterion" style="justify-content:flex-start"><input type="checkbox" name="'+name+'" value="'+x.id+'"><span>'+esc(x.name)+(extra?extra(x):'')+'</span></label>').join('')+'</div>';
    $('#cfgProfileSyllabi').innerHTML=checks('syllabusIds',sy,x=>' · '+(x.instructorPresence==='WITHOUT INSTRUCTOR'?'Without Instructor':'With Instructor')+' · Min '+(x.minimum==null?'—':x.minimum));
    $('#cfgProfileCriteria').innerHTML=checks('criteriaIds',cr,x=>' · '+x.weight+'%');
    $('#cfgProfileEmergencies').innerHTML=checks('emergencyIds',em);
  };
  if($('#cfgProfileForm'))$('#cfgProfileForm').onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.currentTarget),arr=cfgProfilesGet(),old=state.editProfileId?arr.find(x=>x.id===state.editProfileId):null,type=String(fd.get('courseType')),cc=cfgGet();
    const allowedS=new Set(cc.syllabi.filter(x=>x.courseType===type).map(x=>x.id)),allowedC=new Set(cc.criteria.filter(x=>x.courseType===type).map(x=>x.id)),allowedE=new Set(cc.emergencies.filter(x=>x.courseType===type).map(x=>x.id));
    const obj={id:old?.id||cfgId('profile'),name:String(fd.get('name')),courseType:type,phaseId:String(fd.get('phaseId')),trainingKind:String(fd.get('trainingKind')),dayNight:String(fd.get('dayNight')),country:String(fd.get('country')),syllabusIds:fd.getAll('syllabusIds').map(String).filter(x=>allowedS.has(x)),criteriaIds:fd.getAll('criteriaIds').map(String).filter(x=>allowedC.has(x)),emergencyIds:fd.getAll('emergencyIds').map(String).filter(x=>allowedE.has(x))};
    cfgProfilesSave(old?arr.map(x=>x.id===old.id?obj:x):[...arr,obj]);state.editProfileId=null;toast(old?'Configuration profile updated':'Configuration profile created');render();
  };
  if($('#cfgProfileCancel'))$('#cfgProfileCancel').onclick=()=>{state.editProfileId=null;render()};
  document.querySelectorAll('[data-profile-edit]').forEach(btn=>btn.onclick=()=>{state.editProfileId=btn.dataset.profileEdit;render()});
  document.querySelectorAll('[data-profile-delete]').forEach(btn=>btn.onclick=()=>{cfgProfilesSave(cfgProfilesGet().filter(x=>x.id!==btn.dataset.profileDelete));if(state.editProfileId===btn.dataset.profileDelete)state.editProfileId=null;toast('Profile deleted');render()});
}
ensureMultiCourseMemberships();
if(!courseByKey(currentCourseId)||!instructorCourseRole(currentCourseId,currentUserId)){const first=instructorAssignedCourses(currentUserId)[0];if(first)switchCourseByKey(courseKey(first),{screen:state.screen,render:false,force:true})}
ensurePersistentDeviceStorage();
if(flympusPushBootCourse&&courseByKey(flympusPushBootCourse))switchCourseByKey(flympusPushBootCourse,{screen:state.screen,render:false,force:true});
if(flympusPushBootScreen||flympusPushBootCourse){
  try{const u=new URL(location.href);u.searchParams.delete('pushScreen');u.searchParams.delete('pushCourse');history.replaceState(history.state,'',u.pathname+u.search+u.hash)}catch{}
}
initFlympusPushClient();

function flympusContinuitySnapshotHtml(content){
  try{
    const clone=content?.cloneNode?.(true);if(!clone)return content?.innerHTML||'';
    /* Never replay interaction-only overlays from the app switcher snapshot.
       They are not navigation state and otherwise flash for one frame after a
       killed/backgrounded iOS PWA is reconstructed. */
    clone.querySelectorAll?.('.modal.open')?.forEach?.(el=>el.classList.remove('open'));
    clone.querySelectorAll?.('.multiFilterMenu,.datePickerPanel')?.forEach?.(el=>{el.hidden=true;el.removeAttribute?.('data-open')});
    clone.querySelectorAll?.('.fieldInvalidControl')?.forEach?.(el=>el.classList.remove('fieldInvalidControl'));
    return clone.innerHTML
  }catch{return content?.innerHTML||''}
}
function saveFlympusReloadSnapshot(){
  try{
    const content=$('#content');if(!content)return;
    const root=document.documentElement,resolvedTheme=String(root?.getAttribute('data-flympus-theme')||'light'),language=String(root?.getAttribute('data-flympus-language')||'en');
    const d=new Date(),pad=n=>String(n).padStart(2,'0'),localDay=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    const scrollY=Math.max(0,Number(window.scrollY||document.documentElement?.scrollTop||0));
    const snapshot={
      visualVersion:3,
      screen:String(state.screen||'home'),
      courseId:String(currentCourseId||'AEP-26'),
      resolvedTheme:resolvedTheme==='dark'?'dark':'light',
      language:language==='he'?'he':'en',
      largerText:!!root?.classList.contains('flympusLargeText'),
      localDay,
      viewportWidth:Math.round(window.innerWidth||document.documentElement?.clientWidth||0),
      viewportHeight:Math.round(window.innerHeight||document.documentElement?.clientHeight||0),
      html:flympusContinuitySnapshotHtml(content),
      navHtml:$('#mobileBottomNav')?.innerHTML||'',
      halo:(()=>{
        const dock=$('#mobileBottomNav');if(!dock)return null;
        return{
          measured:dock.classList.contains('dockHaloMeasured'),
          ready:dock.classList.contains('dockHaloReady'),
          x:dock.style.getPropertyValue('--dock-halo-x')||'',
          y:dock.style.getPropertyValue('--dock-halo-y')||'',
          width:dock.style.getPropertyValue('--dock-halo-width')||'',
          height:dock.style.getPropertyValue('--dock-halo-height')||''
        };
      })(),
      scrollY,
      topHidden:scrollY>64&&!!$('.top')?.classList.contains('topHidden'),
      savedAt:Date.now()
    };
    sessionStorage.setItem('ct-review-reload-snapshot',JSON.stringify(snapshot));
  }catch{}
}
window.addEventListener('pagehide',saveFlympusReloadSnapshot,{capture:true});
window.addEventListener('beforeunload',saveFlympusReloadSnapshot,{capture:true});
window.addEventListener('freeze',saveFlympusReloadSnapshot,{capture:true});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')saveFlympusReloadSnapshot();
},{capture:true});

const earlyNavTarget=String(window.__FLYMPUS_EARLY_NAV_TARGET__||'');
window.__FLYMPUS_RUNTIME_READY__=true;
if(['roster','planned','home','record','reports'].includes(earlyNavTarget)){
  window.__FLYMPUS_EARLY_NAV_TARGET__='';
  if(state.screen===earlyNavTarget){
    render();
    scrollActiveBottomNavTop(earlyNavTarget);
  }else{
    go(earlyNavTarget,{}, {fastNavigation:true});
    restoreBottomNavScroll(earlyNavTarget);
  }
}else{
  render();
}

/* If this is a real reload, keep Safari's scroll restoration under app control
   and reveal the fully rendered screen only after the exact previous viewport
   has been put back. No intermediate Home/skeleton frame is shown. */
(()=>{
  const snap=window.__FLYMPUS_RELOAD_SNAPSHOT__;
  if(!snap){
    document.documentElement.classList.remove('flympusHydrating');
    return;
  }
  const y=Math.max(0,Number(snap.scrollY||0));
  const restore=()=>{try{window.scrollTo(0,y)}catch{}};
  restore();
  if(typeof requestAnimationFrame==='function'){
    requestAnimationFrame(()=>{restore();requestAnimationFrame(()=>{
      restore();
      document.documentElement.classList.remove('flympusHydrating');
      window.__FLYMPUS_RELOAD_SNAPSHOT__=null;
    })});
  }else{
    document.documentElement.classList.remove('flympusHydrating');
    window.__FLYMPUS_RELOAD_SNAPSHOT__=null;
  }
})();
</script>
