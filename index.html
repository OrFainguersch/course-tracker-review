  return {...defaults,...(bucket[personId]||{})};
}

  const root=getCourseMembershipState(),course=root[courseKey]||{instructors:{},trainees:{}};
  course.instructors=course.instructors||{};course.trainees=course.trainees||{};

function activityTotalsFor(traineeId){
  const out={TAKEOFF:0,LANDING:0,TOUCH_AND_GO:0,TRAINING_HOUR:0,TECH_ACTIVITY:0};
  getActivityEvents().filter(x=>x.traineeId===traineeId).forEach(x=>{

 return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height,scale=Math.min(1,maxSize/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})
}

function packageConfigurationLabel(type,p){

  if(type==='EP')return p.dayNight==='mixed'?'Day + Night':p.dayNight==='night'?'Night':p.dayNight==='day'?'Day':'Shared';
  if(type==='IP'){
    if(p.configurationId==='gcs_d')return 'GCS-D';
    if(p.configurationId==='gcs_c')return 'GCS-C';
    return p.trainingKind==='customer_qualification'?'Qualification package':'General IP package';
  }

    if(p.configurationId==='engine_h_gcs_d')return 'Engine H / GCS-D';
    if(p.configurationId==='engine_d_gcs_c')return 'Engine D / GCS-C';

function courseTailorModel(){
  const core=window.FLYMPUS_TRAINING,active=epCurrentProgram();if(!core||!active)return null;
  const key=currentCourseMeta.courseCode||currentCourseId,o=core.getOverrides(key)||{},type=currentCourseMeta.type,packageId=currentCourseMeta.programId||active.id;
  const inherited=core.resolvePackage?.(type,packageId)||active;
  const merge=(base,added,patches)=>[...(base||[]),...((added||[]).map(x=>({...x,courseOnly:true})))].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).map(x=>({...x,...(patches?.[x.id]||{})}));
  const platformIds=inherited.platformId?[inherited.platformId]:(inherited.platformIds||[]),emergencyBase=[...platformIds.flatMap(id=>core.emergencyCatalog(id)),...(inherited.courseEmergencies||[])];
  const emergencies=merge(emergencyBase,o.custom?.emergencies,o.emergencies),requiredDefaults=core.requiredEmergencies(inherited).map(x=>x.id);
  return {core,key,o,active,inherited,
    syllabi:merge(inherited.syllabi,o.custom?.syllabi,o.syllabi),
    counters:merge(inherited.experienceCounters,o.custom?.counters,o.counters),
    criteria:merge(inherited.criteria,o.custom?.criteria,o.criteria),
    exams:merge(inherited.exams,o.custom?.exams,o.exams),
    progression:merge(inherited.progression,o.custom?.progression,o.progression),
    emergencies,
    required:new Set(Array.isArray(o.emergencyRequirementIds)?o.emergencyRequirementIds:requiredDefaults)
  };
}

function cfgResolve(sel){
  let best=null,score=-1;
  for(const p of cfgProfilesGet()){
    let ok=true,s=0;
    for(const k of ['courseType','phaseId','dayNight']){
      if(p[k]===sel[k])s+=4; else if(p[k]!=='*')ok=false;
    }
    for(const k of ['trainingKind','country']){
      if(p[k]===sel[k])s+=2; else if(p[k]!=='*')ok=false;
    }
    if(ok&&s>score){best=p;score=s}
  }
  return best;
}
