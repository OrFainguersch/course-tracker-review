function roster(){
 const allT=allTrainees().map(t=>{const m=courseMembershipFor(t.id,'TRAINEE',{status:t.status||'Active'});return {...t,status:m.status||'Active',type:'TRAINEE'}});
 const allI=allInstructors().map(i=>{const m=courseMembershipFor(i.id,'INSTRUCTOR',{role:i.role||'INSTRUCTOR'});return {...i,role:m.role||'INSTRUCTOR',type:'INSTRUCTOR'}});
 const type=state.rosterType||'TRAINEE',base=type==='TRAINEE'?allT:allI,manage=!!state.rosterManage;
 let list=type==='TRAINEE'?base.filter(t=>state.filter==='All'||t.status===state.filter):base;
 if(state.search)list=list.filter(t=>(t.name+' '+(t.email||'')).toLowerCase().includes(state.search.toLowerCase()));
 list=list.slice().sort((a,b)=>{
   if(type==='TRAINEE'){
     if((a.status==='Active')!==(b.status==='Active'))return a.status==='Active'?-1:1;
     const ra=Number.isFinite(Number(a.rank))?Number(a.rank):999,rb=Number.isFinite(Number(b.rank))?Number(b.rank):999;if(ra!==rb)return ra-rb;
     const aa=Number(a.average??-999),ab=Number(b.average??-999);if(aa!==ab)return ab-aa;
   }else{
     const ma=a.role==='COURSE_MANAGER',mb=b.role==='COURSE_MANAGER';if(ma!==mb)return ma?-1:1;

function traineeSoloSnapshot(t){
 let stages=configuredSoloStages().map(x=>({name:x.name,minimum:Number(x.minimum)||0}));
 const actual=getSoloFlights().filter(x=>x.traineeId===t.id).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 const mockMap=new Map(mockSoloBreakdown[t.id]||[]);
 if(!stages.length&&mockMap.size)stages=[...mockMap.keys()].map(name=>({name,minimum:Number(mockSoloStageMinimums[name]||Math.max(1,mockMap.get(name)||1))}));
 if(!stages.length)return null;

 actual.forEach(x=>{if(counts.has(x.syllabus)){counts.set(x.syllabus,(counts.get(x.syllabus)||0)+1);dates.set(x.syllabus,x.date)}});

 if(latestActualIndex>=0)currentIndex=latestActualIndex;

 if(completed>0&&completed<minimum)status='In progress';

   const nextCount=counts.get(next.name)||0;
   status=nextCount>0?'In progress':'Ready for next solo';
   if(nextCount>0){currentIndex++;const c2=stages[currentIndex];return {label:'Solo',syllabus:c2.name,date:dates.get(c2.name)||null,completed:counts.get(c2.name)||0,minimum:c2.minimum||0,pct:c2.minimum?Math.min(100,Math.round((counts.get(c2.name)||0)/c2.minimum*100)):0,status:(counts.get(c2.name)||0)>=c2.minimum?(currentIndex===stages.length-1?'Solo complete':'Minimum met'):'In progress'};}
 }

 return {label:'Solo',syllabus:current.name,date:dates.get(current.name)||null,completed,minimum,pct:minimum?Math.min(100,Math.round(completed/minimum*100)):0,status};
}

function cfgResolve(sel){
  let best=null,score=-1;
  for(const p of cfgProfilesGet()){
    let ok=true,s=0;
    for(const k of ['courseType','phaseId','dayNight']){
      if(p[k]===sel[k])s+=4; else if(p[k]!=='*')ok=false;
    }
    for(const k of ['trainingKind','country']){
      if(p[k]===sel[k])s+=2; else if(p[k]!=='*')ok=false;
    }
    if(ok&&s>score){best=p;score=s}
  }
  return best;
}

    localStorage.setItem('ct-review-courses',JSON.stringify(arr));toast(epProgram||p?'Draft created with matched training suit':'Draft created — no matching training suit');render();
  };

  document.querySelectorAll('[data-open-course-draft]').forEach(btn=>btn.onclick=()=>{
    const d=getDraftCourses().find(x=>x.id===btn.dataset.openCourseDraft);if(!d?.selection)return;
    const cc=cfgGet(),sel=d.selection,ph=cfgItem(cc.phases,sel.phaseId),tk=cfgItem(cc.trainingKinds,sel.trainingKind),dn=cfgItem(cc.dayNight,sel.dayNight),co=cfgItem(cc.countries,sel.country);
    Object.assign(currentCourseMeta,{type:sel.courseType,phase:ph?.name||sel.phaseId,platformId:sel.platformId||'',trainingKind:tk?.name||sel.trainingKind,dayNight:dn?.name||sel.dayNight,country:co?.name||sel.country,programId:d.programId||null,courseName:d.name||course.name,courseCode:d.code||''});
    localStorage.setItem('ct-review-active-course',JSON.stringify(currentCourseMeta));state.screen='home';toast((d.name||'Course')+' opened with its training suit');render();
  });
    if($('#typeWorkspace'))$('#typeWorkspace').onchange=e=>{state.typeWorkspace=e.target.value;state.phaseScope=e.target.value;render()};
  if($('#phaseScope'))$('#phaseScope').onchange=e=>{state.phaseScope=e.target.value;state.typeWorkspace=e.target.value;render()};

  if($('#cfgSaveCatalogs'))$('#cfgSaveCatalogs').onclick=()=>{
    const cc=cfgGet();
    document.querySelectorAll('.cfgName').forEach(el=>{const x=cc[el.dataset.kind]?.find(v=>v.id===el.dataset.id);if(x&&el.value.trim())x.name=el.value.trim()});
    document.querySelectorAll('.cfgPhaseName').forEach(el=>{const x=cc.phases.find(v=>v.id===el.dataset.id);if(x&&el.value.trim())x.name=el.value.trim()});document.querySelectorAll('.phaseTrackingEnabled').forEach(el=>{const x=cc.phases.find(v=>v.id===el.dataset.id);if(x){x.tracking=normalizePhaseTracking(x);x.tracking.enabled=el.checked}});document.querySelectorAll('.phaseCounterEnabled').forEach(el=>{const x=cc.phases.find(v=>v.id===el.dataset.id);if(x){x.tracking=normalizePhaseTracking(x);x.tracking.counters[el.dataset.counter].enabled=el.checked}});document.querySelectorAll('.phaseCounterMinimum').forEach(el=>{const x=cc.phases.find(v=>v.id===el.dataset.id);if(x){x.tracking=normalizePhaseTracking(x);x.tracking.counters[el.dataset.counter].minimum=el.value===''?null:Number(el.value)}});
    document.querySelectorAll('.cfgScopedName').forEach(el=>{const x=cc[el.dataset.kind]?.find(v=>v.id===el.dataset.id);if(x&&el.value.trim())x.name=el.value.trim()});
    document.querySelectorAll('.cfgScopedWeight').forEach(el=>{const x=cc.criteria.find(v=>v.id===el.dataset.id);if(x)x.weight=Math.max(0,Math.min(100,Number(el.value)||0))});document.querySelectorAll('.cfgEmergencyCategory').forEach(el=>{const x=cc.emergencies.find(v=>v.id===el.dataset.id);if(x)x.category=el.value||'General / Operational'});document.querySelectorAll('.cfgSyllabusMinimum').forEach(el=>{const x=cc.syllabi.find(v=>v.id===el.dataset.id);if(x)x.minimum=el.value===''?null:Math.max(0,Math.min(999,Math.floor(Number(el.value)||0)))});document.querySelectorAll('.cfgSyllabusPresence').forEach(el=>{const x=cc.syllabi.find(v=>v.id===el.dataset.id);if(x)x.instructorPresence=el.value});
    cfgSave(cc);toast('All changes saved for this course type');render();
  };

  document.querySelectorAll('.cfgAddForm').forEach(form=>form.onsubmit=e=>{
    e.preventDefault();const cc=cfgGet(),kind=form.dataset.kind,name=String(new FormData(form).get('name')||'').trim();if(!name)return;
    const prefix={courseTypes:'type',trainingKinds:'training',dayNight:'time',countries:'country'}[kind]||'item';
    cc[kind].push({id:cfgId(prefix),name});cfgSave(cc);toast(name+' added');render();
  });

  document.querySelectorAll('.cfgScopedAdd').forEach(form=>form.onsubmit=e=>{
    e.preventDefault();const cc=cfgGet(),kind=form.dataset.kind,type=form.dataset.courseType,fd=new FormData(form),name=String(fd.get('name')||'').trim();if(!name)return;
    const obj={id:cfgId(kind==='criteria'?'criterion':kind==='syllabi'?'syllabus':'emergency'),courseType:type,name};
    if(kind==='criteria')obj.weight=Math.max(0,Math.min(100,Number(fd.get('weight'))||0));if(kind==='emergencies')obj.category=String(fd.get('category')||'General / Operational');if(kind==='syllabi'){obj.minimum=fd.get('minimum')===''?null:Math.max(0,Math.min(999,Math.floor(Number(fd.get('minimum'))||0)));obj.instructorPresence=String(fd.get('instructorPresence')||'WITH INSTRUCTOR')}
    cc[kind].push(obj);cfgSave(cc);toast(name+' added to '+(cfgItem(cc.courseTypes,type)?.name||type));render();

    cfgSave(cc);toast('Catalog item removed');render();

  document.querySelectorAll('[data-scoped-remove]').forEach(btn=>btn.onclick=()=>{const [kind,id]=btn.dataset.scopedRemove.split('|'),cc=cfgGet();cc[kind]=cc[kind].filter(x=>x.id!==id);cfgSave(cc);toast('Item removed');render()});

  if($('#cfgAddPhase'))$('#cfgAddPhase').onsubmit=e=>{
    e.preventDefault();const cc=cfgGet(),name=String(new FormData(e.currentTarget).get('name')||'').trim(),type=state.typeWorkspace||state.phaseScope||cc.courseTypes[0]?.id||'';if(!name||!type)return;

  };

  if($('#cfgResetCatalogs'))$('#cfgResetCatalogs').onclick=()=>{if(confirm('Reset all course-type configuration to defaults?')){localStorage.removeItem('ct-review-catalogs');state.typeWorkspace=null;state.phaseScope=null;toast('Configuration reset');render()}};

  if($('#cfgProfileType'))$('#cfgProfileType').onchange=e=>{
    const cc=cfgGet(),type=e.target.value,ph=cc.phases.filter(x=>x.type===type),sy=cc.syllabi.filter(x=>x.courseType===type),cr=cc.criteria.filter(x=>x.courseType===type),em=cc.emergencies.filter(x=>x.courseType===type);

    $('#cfgProfilePhase').disabled=false;$('#cfgProfilePhase').innerHTML='<option value="" selected disabled>Select phase</option>'+ph.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
    const checks=(name,list,extra)=>'<div class="criteria">'+list.map(x=>'<label class="criterion" style="justify-content:flex-start"><input type="checkbox" name="'+name+'" value="'+x.id+'"><span>'+esc(x.name)+(extra?extra(x):'')+'</span></label>').join('')+'</div>';
    $('#cfgProfileSyllabi').innerHTML=checks('syllabusIds',sy,x=>' · '+(x.instructorPresence==='WITHOUT INSTRUCTOR'?'Without Instructor':'With Instructor')+' · Min '+(x.minimum==null?'—':x.minimum));
    $('#cfgProfileCriteria').innerHTML=checks('criteriaIds',cr,x=>' · '+x.weight+'%');
    $('#cfgProfileEmergencies').innerHTML=checks('emergencyIds',em);
  };
  if($('#cfgProfileForm'))$('#cfgProfileForm').onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.currentTarget),arr=cfgProfilesGet(),old=state.editProfileId?arr.find(x=>x.id===state.editProfileId):null,type=String(fd.get('courseType')),cc=cfgGet();
    const allowedS=new Set(cc.syllabi.filter(x=>x.courseType===type).map(x=>x.id)),allowedC=new Set(cc.criteria.filter(x=>x.courseType===type).map(x=>x.id)),allowedE=new Set(cc.emergencies.filter(x=>x.courseType===type).map(x=>x.id));
    const obj={id:old?.id||cfgId('profile'),name:String(fd.get('name')),courseType:type,phaseId:String(fd.get('phaseId')),trainingKind:String(fd.get('trainingKind')),dayNight:String(fd.get('dayNight')),country:String(fd.get('country')),syllabusIds:fd.getAll('syllabusIds').map(String).filter(x=>allowedS.has(x)),criteriaIds:fd.getAll('criteriaIds').map(String).filter(x=>allowedC.has(x)),emergencyIds:fd.getAll('emergencyIds').map(String).filter(x=>allowedE.has(x))};
    cfgProfilesSave(old?arr.map(x=>x.id===old.id?obj:x):[...arr,obj]);state.editProfileId=null;toast(old?'Configuration profile updated':'Configuration profile created');render();
  };
  if($('#cfgProfileCancel'))$('#cfgProfileCancel').onclick=()=>{state.editProfileId=null;render()};
  document.querySelectorAll('[data-profile-edit]').forEach(btn=>btn.onclick=()=>{state.editProfileId=btn.dataset.profileEdit;render()});
  document.querySelectorAll('[data-profile-delete]').forEach(btn=>btn.onclick=()=>{cfgProfilesSave(cfgProfilesGet().filter(x=>x.id!==btn.dataset.profileDelete));if(state.editProfileId===btn.dataset.profileDelete)state.editProfileId=null;toast('Profile deleted');render()});
}
render();
