<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#07294c" />
<title>Course Tracker Next — iPhone Review</title>
<style>
:root{--navy:#07294c;--navy2:#0a315c;--sky:#13a8ee;--bg:#f4f8fc;--card:#fff;--line:#dbe5ef;--muted:#64748b;--text:#0f172a;--green:#047857;--amber:#b45309;--rose:#be123c;--violet:#7c3aed;--shadow:0 10px 30px rgba(31,71,112,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
body{min-height:100vh}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;height:66px;display:flex;align-items:center;gap:12px;padding:0 16px;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(219,229,239,.9)}
.menuBtn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:14px;display:grid;place-items:center;color:var(--navy2)}.topTitle{min-width:0;flex:1}.topTitle b{display:block;color:var(--navy2);font-size:14px}.topTitle span{font-size:12px;color:var(--muted)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffe6b3;color:#8a4b00;font-weight:800;border:1px solid rgba(138,75,0,.1)}
.drawer{position:fixed;inset:0;z-index:50;pointer-events:none}.drawer.open{pointer-events:auto}.backdrop{position:absolute;inset:0;background:rgba(2,8,23,.35);opacity:0;transition:.2s}.drawer.open .backdrop{opacity:1}.panel{position:absolute;left:0;top:0;bottom:0;width:min(82vw,310px);background:var(--navy);color:#fff;transform:translateX(-102%);transition:.22s ease;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));overflow:auto}.drawer.open .panel{transform:none}.brand{font-size:18px;font-weight:900;padding:8px 10px 18px}.navLabel{padding:18px 12px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#8ecaf0}.navBtn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#eaf6ff;padding:12px;border-radius:14px;text-align:left;margin:3px 0}.navBtn.active{background:#11a8ef;color:#fff}.navBtn span:first-child{width:22px;text-align:center}.drawerFooter{margin-top:26px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);padding:10px;border-radius:16px;display:flex;align-items:center;gap:10px}.drawerFooter small{display:block;color:#9bc9e7;margin-top:2px}
main{padding:18px 14px calc(88px + env(safe-area-inset-bottom));max-width:1480px;margin:auto}.eyebrow{color:#0284c7;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.16em}.pageTitle{font-size:30px;line-height:1.05;margin:8px 0 6px;color:var(--navy2);font-weight:950}.sub{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 18px}.hero{position:relative;overflow:hidden;background:#092f58;color:#fff;border-radius:26px;padding:24px;box-shadow:0 18px 50px rgba(9,47,88,.18)}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(56,189,248,.18);right:-70px;top:-100px;filter:blur(12px)}.hero h1{position:relative;margin:5px 0 7px;font-size:26px;line-height:1.1}.hero p{position:relative;color:#c8e7fb;margin:0;font-size:13px;line-height:1.5}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800}.pill.green{background:#dcfce7;color:#047857}.pill.amber{background:#fef3c7;color:#92400e}.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.violet{background:#ede9fe;color:#6d28d9}.pill.gray{background:#eef2f7;color:#475569}
.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));margin:14px 0 24px}.card{background:#fff;border:1px solid rgba(219,229,239,.95);border-radius:20px;box-shadow:var(--shadow)}.metric{padding:14px}.metric .label{font-size:11px;color:var(--muted);font-weight:700}.metric .value{font-size:22px;color:var(--navy2);font-weight:950;margin:4px 0 1px}.metric .detail{font-size:11px;color:var(--muted)}.sectionHead{margin:20px 0 10px}.sectionHead h2{margin:0;color:var(--navy2);font-size:19px}.sectionHead p{margin:3px 0 0;color:var(--muted);font-size:13px}.action{border:0;width:100%;background:#fff;padding:16px;text-align:left;display:flex;gap:14px;align-items:center}.actionIcon{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:20px;flex:0 0 auto}.action b{display:block;color:var(--navy2);font-size:15px}.action small{display:block;color:var(--muted);margin-top:3px;line-height:1.3}.action .arr{margin-left:auto;color:#94a3b8;font-size:24px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:var(--navy2);color:#fff}.btn.secondary{background:#fff;color:var(--navy2);border:1px solid var(--line)}.btn.sky{background:#0ea5e9}.btn.danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.btn.small{padding:8px 10px;font-size:12px}.formCard{padding:16px}.formTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.formTitle h2{margin:0;color:var(--navy2);font-size:19px}.fields{display:grid;grid-template-columns:1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;color:#334155;margin:0 0 6px}.input,select,textarea{width:100%;border:1px solid #cbd8e6;background:#fff;border-radius:12px;padding:12px;color:#0f172a;outline:none}.input:focus,select:focus,textarea:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.12)}textarea{min-height:92px;resize:vertical}.criteria{display:grid;gap:8px}.criterion{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;justify-content:space-between}.criterion span{font-size:13px;font-weight:700}.criterion select{width:86px;padding:9px}.suggested{background:#eaf7ff;border-radius:18px;padding:14px;margin:14px 0}.suggested small{font-weight:900;text-transform:uppercase;color:#0369a1}.suggested strong{display:block;font-size:32px;color:var(--navy2);margin-top:2px}.saved{padding:16px;margin-top:14px}.saved h2{color:var(--navy2);font-size:18px;margin:0 0 12px}.evalItem{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:9px}.evalTop{display:flex;justify-content:space-between;gap:8px}.evalItem b{color:var(--navy2)}.evalItem p{margin:4px 0 0;color:var(--muted);font-size:12px}.evalItem .toolbar{margin-bottom:0}
.search{display:flex;gap:8px;margin:12px 0}.search input{flex:1}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#475569;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800}.tab.active{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}.people{display:grid;gap:11px;margin-top:12px}.personCard{padding:15px;display:flex;gap:13px;align-items:center}.personInfo{min-width:0;flex:1}.personInfo b{display:block;color:var(--navy2)}.personInfo small{display:block;color:var(--muted);margin-top:3px}.progress{height:8px;background:#eaf0f6;border-radius:999px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#0ea5e9;border-radius:inherit}.statrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.statrow span{font-size:11px;color:#64748b}.profileHero{padding:18px}.profileTop{display:flex;gap:14px;align-items:center}.bigAvatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#dff3ff;color:#0369a1;font-weight:950;font-size:20px}.profileHero h2{margin:0;color:var(--navy2)}.profileHero p{margin:3px 0;color:var(--muted);font-size:12px}.profileMetrics{grid-template-columns:repeat(2,1fr);margin-top:14px}.mini{padding:12px;background:#f8fbfe;border:1px solid #e6eef6;border-radius:14px}.mini small{color:#64748b}.mini strong{display:block;color:var(--navy2);font-size:20px;margin-top:2px}.timeline{padding:16px;margin-top:12px}.timeline h3{margin:0 0 12px;color:var(--navy2)}.syll{padding:10px 0;border-bottom:1px solid #edf2f7}.syll:last-child{border-bottom:0}.syllRow{display:flex;justify-content:space-between;gap:8px;font-size:13px}.settingsGrid{display:grid;gap:12px}.settingBox{padding:16px}.settingBox h3{margin:0 0 10px;color:var(--navy2)}.editableList{display:grid;gap:8px}.editableRow{display:flex;gap:8px;align-items:center}.editableRow input{flex:1}.empty{padding:38px 20px;text-align:center}.empty .icon{font-size:38px}.empty h3{color:var(--navy2);margin:10px 0 6px}.empty p{color:var(--muted);font-size:13px;line-height:1.5;margin:0}.reviewBanner{position:fixed;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;background:#fffbe8;color:#7c5800;border:1px solid #f4df8b;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:100;background:#0f172a;color:#fff;border-radius:14px;padding:11px 14px;font-size:12px;transition:.2s;pointer-events:none;max-width:86vw}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:760px){body{padding-left:248px}.top{padding-left:28px}.menuBtn{display:none}.drawer{pointer-events:auto;left:0;width:248px}.backdrop{display:none}.panel{transform:none;width:248px}.drawerFooter{position:absolute;bottom:18px;left:14px;right:14px}.metrics{grid-template-columns:repeat(5,1fr)}.actions{grid-template-columns:repeat(3,1fr)}.fields{grid-template-columns:repeat(2,1fr)}.people{grid-template-columns:repeat(2,1fr)}.settingsGrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app"><header class="top"><button class="menuBtn" id="menuBtn">☰</button><div class="topTitle"><b>Aerostar EP Course</b><span>AEP-26 · Active</span></div><div class="avatar">OF</div></header><div class="drawer" id="drawer"><div class="backdrop" id="backdrop"></div><aside class="panel"><div class="brand">Course Tracker Next</div><div id="nav"></div><div class="drawerFooter"><div class="avatar">OF</div><div><b>Or Fainguersch</b><small>Instructor · local review</small></div></div></aside></div><main id="content"></main><div class="reviewBanner">iPhone Review · mock/local only</div><div class="toast" id="toast"></div></div>
<script>
const course={name:'Aerostar EP Course',code:'AEP-26'};
const trainees=[
{id:'t1',name:'Yoav Shauli',initials:'YS',status:'Active',progress:85,totalFlights:29,instructedFlights:18,soloFlights:11,average:4.4,rank:1,currentSyllabus:'Complex Emergencies',nextSyllabus:'Pre-Test Preparation',startDate:'Sep 3'},
{id:'t2',name:'Noam Cohen',initials:'NC',status:'Active',progress:72,totalFlights:24,instructedFlights:18,soloFlights:6,average:4.1,rank:3,currentSyllabus:'Basic Emergencies B',nextSyllabus:'Complex Emergencies',startDate:'Sep 6'},
{id:'t3',name:'Dana Levi',initials:'DL',status:'Active',progress:76,totalFlights:25,instructedFlights:18,soloFlights:7,average:4.2,rank:2,currentSyllabus:'Basic Emergencies B',nextSyllabus:'Complex Emergencies',startDate:'Sep 6'},
{id:'t4',name:'Amit Barak',initials:'AB',status:'Active',progress:61,totalFlights:20,instructedFlights:17,soloFlights:3,average:3.9,rank:4,currentSyllabus:'Advanced Circuits',nextSyllabus:'Basic Emergencies A',startDate:'Sep 9'},
{id:'t5',name:'Lior Dayan',initials:'LD',status:'Inactive',progress:38,totalFlights:13,instructedFlights:13,soloFlights:0,average:null,rank:null,currentSyllabus:'Circuits',nextSyllabus:null,startDate:'Sep 10'}];
const instructors=[{id:'i1',name:'Or Fainguersch'},{id:'i2',name:'Nir Schneider'}];
const syllabi=['Basic Handling','Figure 8','Circuits','Touch & Go','Basic Emergencies A','Basic Emergencies B','Complex Emergencies','Complex Engine Emergencies','Pre-Test Preparation','Solo Certification Check'];
const criteria=[{id:'c1',name:'Flight path control',weight:.25},{id:'c2',name:'Work method',weight:.2},{id:'c3',name:'Airmanship',weight:.2},{id:'c4',name:'Emergency handling',weight:.2},{id:'c5',name:'Brief / debrief quality',weight:.15}];
const emergencies=['Engine cut','GEN malfunction','BAT malfunction','NO RPT','Stuck flaps'];
const syllProgress=[['Basic Handling',100,'Complete'],['Figure 8',100,'Complete'],['Circuits',100,'Complete'],['Emergencies',80,'Current'],['Final Preparation',0,'Next']];
const state={screen:'home',selectedTrainee:'t1',search:'',filter:'All',editingEval:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function getEvaluations(){try{return JSON.parse(localStorage.getItem('ct-review-evals')||'[]')}catch{return []}}function setEvaluations(x){try{localStorage.setItem('ct-review-evals',JSON.stringify(x))}catch{}}
const nav=[['home','⌂','Home'],['evaluation','✓','Evaluation'],['safety','◈','Safety'],['exams','▤','Exams'],['planned','▣','Planned vs Executed'],['__label','','COURSE'],['roster','♙','Course Roster'],['reports','▥','Reports'],['settings','⚙','Course Settings']];
function renderNav(){const n=$('#nav');n.innerHTML=nav.map(([id,ic,l])=>id==='__label'?'<div class="navLabel">'+l+'</div>':`<button class="navBtn ${state.screen===id?'active':''}" data-nav="${id}"><span>${ic}</span><span>${l}</span></button>`).join('');n.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));}
function go(screen,extra={}){Object.assign(state,extra,{screen});$('#drawer').classList.remove('open');render()}
$('#menuBtn').onclick=()=>$('#drawer').classList.add('open');$('#backdrop').onclick=()=>$('#drawer').classList.remove('open');
function metric(label,value,detail){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="detail">${detail||''}</div></div>`}
function home(){return `<section class="hero"><span class="pill blue">ACTIVE COURSE</span><h1>Aerostar EP Course</h1><p>Training operations, evaluation and course progress — review build for iPhone.</p></section><section class="grid metrics">${metric('Active trainees','4','of 5 total')}${metric('Flights executed','72','53% of plan')}${metric('Course average','4.2','current cohort')}${metric('Open safety','0','2 historical')}${metric('Evaluations','${getEvaluations().length}','local review')}</section><div class="sectionHead"><h2>Quick actions</h2><p>Jump straight into the main operational flows.</p></div><section class="grid actions"><button class="card action" data-go="evaluation"><div class="actionIcon" style="background:#0ea5e9">✓</div><div><b>Start evaluation</b><small>Score, comment and save a local review evaluation.</small></div><span class="arr">›</span></button><button class="card action" data-go="roster"><div class="actionIcon" style="background:#7c3aed">♙</div><div><b>Course roster</b><small>Trainees, status, progress and next syllabus.</small></div><span class="arr">›</span></button><button class="card action" data-go="settings"><div class="actionIcon" style="background:#059669">⚙</div><div><b>Course settings</b><small>Edit mock catalogs stored only in this browser.</small></div><span class="arr">›</span></button></section>`}
function evaluation(){const list=getEvaluations(),edit=state.editingEval?list.find(x=>x.id===state.editingEval):null;return `<div class="eyebrow">Evaluation workflow</div><h1 class="pageTitle">${edit?'Revise evaluation':'New evaluation'}</h1><p class="sub">Interactive review flow. Saving persists only in this browser via localStorage.</p><section class="card formCard"><div class="formTitle"><h2>Flight evaluation</h2><span class="pill blue">${edit?'Revision '+(edit.revision+1):'New'}</span></div><form id="evalForm"><div class="fields"><div class="field"><label>Trainee</label><select name="trainee" ${edit?'disabled':''}>${trainees.filter(t=>t.status==='Active').map(t=>`<option value="${t.id}" ${(edit?.traineeId||state.selectedTrainee)===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div><div class="field"><label>Instructor</label><select name="instructor">${instructors.map(i=>`<option value="${i.id}" ${edit?.instructorId===i.id?'selected':''}>${i.name}</option>`).join('')}</select></div><div class="field"><label>Syllabus</label><select name="syllabus">${syllabi.map(s=>`<option ${edit?.syllabus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Duration (minutes)</label><input class="input" name="duration" type="number" min="1" value="${edit?.duration||20}"></div><div class="field"><label>Date</label><input class="input" name="date" type="date" value="${edit?.flightDate||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Time</label><input class="input" name="time" type="time" value="${edit?.time||'10:00'}"></div></div><div class="sectionHead"><h2>Performance criteria</h2><p>1–5 scale for the mock review.</p></div><div class="criteria">${criteria.map(c=>`<div class="criterion"><span>${c.name} <small style="color:#94a3b8">(${c.weight*100}%)</small></span><select name="score_${c.id}"><option value="0">—</option>${[1,2,3,4,5].map(v=>`<option value="${v}" ${edit?.scores?.[c.id]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><div class="suggested"><small>Suggested grade</small><strong id="suggestedGrade">${edit?.grade??'—'}</strong></div><div class="fields"><div class="field"><label>Comments</label><textarea name="comments" placeholder="Observed performance…">${esc(edit?.comments||'')}</textarea></div><div class="field"><label>Emphases for next flight</label><textarea name="emphases" placeholder="What to preserve / improve…">${esc(edit?.emphases||'')}</textarea></div></div><div class="sectionHead"><h2>Emergencies</h2><p>Mock occurrence count for this evaluation.</p></div><div class="criteria">${emergencies.map((e,i)=>`<div class="criterion"><span>${e}</span><select name="em_${i}">${[0,1,2,3].map(v=>`<option value="${v}" ${edit?.emergencies?.[i]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><div class="toolbar"><button class="btn sky" type="submit">${edit?'Save revision':'Save evaluation'}</button><button class="btn secondary" type="button" id="draftBtn">Save draft</button>${edit?'<button class="btn danger" type="button" id="cancelEdit">Cancel revision</button>':''}</div></form></section><section class="card saved"><h2>Saved locally</h2>${list.length?list.map(evalCard).join(''):'<p style="color:#64748b;font-size:13px">No evaluations yet in this review browser.</p>'}</section>`}
function evalCard(e){return `<div class="evalItem"><div class="evalTop"><div><b>${e.traineeName}</b><p>${e.syllabus} · ${e.flightDate} · ${e.instructorName}</p></div><span class="pill green">${e.grade}</span></div><p>Revision ${e.revision||1} · ${e.duration} min</p><div class="toolbar"><button class="btn secondary small" data-edit-eval="${e.id}">Create revision</button></div></div>`}
function roster(){let list=trainees.filter(t=>state.filter==='All'||t.status===state.filter);if(state.search)list=list.filter(t=>t.name.toLowerCase().includes(state.search.toLowerCase()));return `<div class="eyebrow">Course roster</div><h1 class="pageTitle">People in the course</h1><p class="sub">Active trainees first, with progress and next syllabus visible at a glance.</p><div class="search"><input class="input" id="rosterSearch" placeholder="Search trainee…" value="${esc(state.search)}"><button class="btn secondary" id="clearSearch">Clear</button></div><div class="tabs">${['All','Active','Inactive'].map(x=>`<button class="tab ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><section class="people">${list.map(t=>`<button class="card personCard" data-trainee="${t.id}" style="border:1px solid #dbe5ef;text-align:left"><div class="bigAvatar" style="width:50px;height:50px;border-radius:16px">${t.initials}</div><div class="personInfo"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><b>${t.name}</b><span class="pill ${t.status==='Active'?'green':'gray'}">${t.status}</span></div><small>${t.status==='Active'?`Next: ${t.nextSyllabus}`:'Training paused'}</small><div class="progress"><i style="width:${t.progress}%"></i></div><div class="statrow"><span>${t.progress}% complete</span><span>${t.totalFlights} flights</span>${t.average?`<span>Avg ${t.average}</span>`:''}</div></div><span class="arr">›</span></button>`).join('')}</section>`}
function traineeProfile(){const t=trainees.find(x=>x.id===state.selectedTrainee)||trainees[0];return `<button class="btn secondary small" id="backRoster">‹ Back to roster</button><section class="card profileHero" style="margin-top:12px"><div class="profileTop"><div class="bigAvatar">${t.initials}</div><div><h2>${t.name}</h2><p>${t.status} · Started ${t.startDate}</p><span class="pill ${t.status==='Active'?'green':'gray'}">${t.status}</span></div></div><div class="grid profileMetrics">${mini('Average',t.average??'—')}${mini('Course rank',t.rank?`#${t.rank}`:'—')}${mini('Flights',t.totalFlights)}${mini('Progress',`${t.progress}%`)}</div></section><section class="card timeline"><h3>Training progress</h3>${syllProgress.map(([n,p,s])=>`<div class="syll"><div class="syllRow"><b>${n}</b><span class="pill ${s==='Complete'?'green':s==='Next'?'blue':'amber'}">${s}</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`).join('')}</section><section class="card timeline"><h3>Flight summary</h3><div class="grid profileMetrics">${mini('Instructed',t.instructedFlights)}${mini('Solo',t.soloFlights)}${mini('Current syllabus',t.currentSyllabus)}${mini('Next syllabus',t.nextSyllabus||'—')}</div></section>`}
function mini(l,v){return `<div class="mini"><small>${l}</small><strong>${v}</strong></div>`}
function settings(){const saved=getSettings();return `<div class="eyebrow">Editable configuration database</div><h1 class="pageTitle">Course Settings</h1><p class="sub">This review build edits browser-local configuration only.</p><div class="settingsGrid"><section class="card settingBox"><h3>Course identity</h3><div class="field"><label>Course name</label><input class="input" id="courseName" value="${esc(saved.courseName||course.name)}"></div><div class="field" style="margin-top:10px"><label>Course code</label><input class="input" id="courseCode" value="${esc(saved.courseCode||course.code)}"></div><div class="toolbar"><button class="btn sky" id="saveCourseSettings">Save locally</button></div></section><section class="card settingBox"><h3>Syllabus catalog</h3><div class="editableList" id="syllList">${(saved.syllabi||syllabi).map((s,i)=>`<div class="editableRow"><input class="input syllInput" data-i="${i}" value="${esc(s)}"><button class="btn danger small" data-rm-syll="${i}">Remove</button></div>`).join('')}</div><div class="toolbar"><button class="btn secondary" id="addSyll">+ Add syllabus</button><button class="btn sky" id="saveSyll">Save catalog</button></div></section><section class="card settingBox"><h3>Evaluation criteria</h3><div class="editableList">${criteria.map(c=>`<div class="editableRow"><input class="input" value="${c.name}" readonly><span class="pill blue">${c.weight*100}%</span></div>`).join('')}</div></section><section class="card settingBox"><h3>Local review controls</h3><p class="sub">Reset only the browser-local review data.</p><button class="btn danger" id="resetLocal">Reset review data</button></section></div>`}
function getSettings(){try{return JSON.parse(localStorage.getItem('ct-review-settings')||'{}')}catch{return {}}}function saveSettings(x){try{localStorage.setItem('ct-review-settings',JSON.stringify(x))}catch{}}
function placeholder(title,icon){return `<div class="eyebrow">Reserved workflow</div><h1 class="pageTitle">${title}</h1><section class="card empty"><div class="icon">${icon}</div><h3>Reserved for a later phase</h3><p>The route exists in the current codebase, but this iPhone review build does not simulate the backend workflow here.</p></section>`}
function reports(){return `<div class="eyebrow">Reports & analytics</div><h1 class="pageTitle">Course analytics</h1><p class="sub">Preview of the reporting direction; no production data is used.</p><section class="grid metrics">${metric('Course average','4.2','+0.3 trend')}${metric('Flights complete','72','of 136 planned')}${metric('Active trainees','4','1 inactive')}${metric('Open safety','0','2 historical')}</section><section class="card settingBox"><h3>Export-ready report ideas</h3><div class="editableList"><div class="editableRow"><span class="pill blue">01</span><input class="input" value="Trainee grade trend" readonly></div><div class="editableRow"><span class="pill violet">02</span><input class="input" value="Syllabus completion distribution" readonly></div><div class="editableRow"><span class="pill green">03</span><input class="input" value="Planned vs executed flights" readonly></div></div></section>`}
function render(){renderNav();let html='';switch(state.screen){case'home':html=home();break;case'evaluation':html=evaluation();break;case'roster':html=roster();break;case'profile':html=traineeProfile();break;case'settings':html=settings();break;case'reports':html=reports();break;case'safety':html=placeholder('Safety','◈');break;case'exams':html=placeholder('Exams','▤');break;case'planned':html=placeholder('Planned vs Executed','▣');break}$('#content').innerHTML=html;bind();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-trainee]').forEach(b=>b.onclick=()=>go('profile',{selectedTrainee:b.dataset.trainee}));if($('#rosterSearch')){$('#rosterSearch').oninput=e=>{state.search=e.target.value;clearTimeout(window._rs);window._rs=setTimeout(render,120)};$('#clearSearch').onclick=()=>{state.search='';render()}}if($('#backRoster'))$('#backRoster').onclick=()=>go('roster');if($('#evalForm'))bindEval();if($('#saveCourseSettings'))bindSettings();document.querySelectorAll('[data-edit-eval]').forEach(b=>b.onclick=()=>{state.editingEval=b.dataset.editEval;render()});}
function bindEval(){const f=$('#evalForm');const scoreEls=[...f.querySelectorAll('select[name^="score_"]')];const recalc=()=>{let vals=scoreEls.map(x=>Number(x.value));$('#suggestedGrade').textContent=vals.every(Boolean)?(vals.reduce((a,v)=>a+v,0)/vals.length).toFixed(1):'—'};scoreEls.forEach(x=>x.onchange=recalc);$('#draftBtn').onclick=()=>toast('Draft saved locally for review');if($('#cancelEdit'))$('#cancelEdit').onclick=()=>{state.editingEval=null;render()};f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const list=getEvaluations();const old=state.editingEval?list.find(x=>x.id===state.editingEval):null;const traineeId=old?.traineeId||fd.get('trainee');const instId=fd.get('instructor');const scores={};criteria.forEach(c=>scores[c.id]=Number(fd.get('score_'+c.id))||0);const grade=(Object.values(scores).reduce((a,v)=>a+v,0)/criteria.length).toFixed(1);const obj={id:old?.id||'ev_'+Date.now(),revision:old?(old.revision||1)+1:1,traineeId,instructorId:instId,traineeName:trainees.find(t=>t.id===traineeId)?.name||'Trainee',instructorName:instructors.find(i=>i.id===instId)?.name||'Instructor',syllabus:fd.get('syllabus'),duration:Number(fd.get('duration')),flightDate:fd.get('date'),time:fd.get('time'),scores,grade,comments:fd.get('comments'),emphases:fd.get('emphases'),emergencies:emergencies.map((_,i)=>Number(fd.get('em_'+i))||0)};const next=old?list.map(x=>x.id===old.id?obj:x):[obj,...list];setEvaluations(next);state.editingEval=null;toast(old?'Revision saved locally':'Evaluation saved locally');render()}}
function bindSettings(){const s=getSettings();$('#saveCourseSettings').onclick=()=>{saveSettings({...getSettings(),courseName:$('#courseName').value,courseCode:$('#courseCode').value});toast('Course settings saved locally')};$('#addSyll').onclick=()=>{const cur=[...document.querySelectorAll('.syllInput')].map(x=>x.value);saveSettings({...getSettings(),syllabi:[...cur,'New syllabus']});render()};$('#saveSyll').onclick=()=>{saveSettings({...getSettings(),syllabi:[...document.querySelectorAll('.syllInput')].map(x=>x.value)});toast('Syllabus catalog saved locally')};document.querySelectorAll('[data-rm-syll]').forEach(b=>b.onclick=()=>{const cur=[...document.querySelectorAll('.syllInput')].map(x=>x.value);cur.splice(Number(b.dataset.rmSyll),1);saveSettings({...getSettings(),syllabi:cur});render()});$('#resetLocal').onclick=()=>{if(confirm('Reset local review data?')){localStorage.removeItem('ct-review-evals');localStorage.removeItem('ct-review-settings');toast('Local review data reset');render()}}}
render();
</script>
</body>
</html>
