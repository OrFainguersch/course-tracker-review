<body>
<div class="app"><header class="top"><button class="menuBtn" id="menuBtn">☰</button><div class="topTitle"><b>Aerostar EP Course</b><span>AEP-26 · Active</span></div><div class="avatar">OF</div></header><div class="drawer" id="drawer"><div class="backdrop" id="backdrop"></div><aside class="panel"><div class="brand">Course Tracker Next</div><div id="nav"></div><div class="drawerFooter"><div class="avatar">OF</div><div><b>Or Fainguersch</b><small>Instructor · local review</small></div></div></aside></div><main id="content"></main><div class="reviewBanner">iPhone Review · mock/local only</div><div class="toast" id="toast"></div></div>
<script>
const course={name:'Aerostar EP Course',code:'AEP-26'};
const trainees=[
{id:'t1',name:'Yoav Shauli',initials:'YS',status:'Active',progress:85,totalFlights:29,instructedFlights:18,soloFlights:11,average:4.4,rank:1,currentSyllabus:'Complex Emergencies',nextSyllabus:'Pre-Test Preparation',startDate:'Sep 3'},
{id:'t2',name:'Noam Cohen',initials:'NC',status:'Active',progress:72,totalFlights:24,instructedFlights:18,soloFlights:6,average:4.1,rank:3,currentSyllabus:'Basic Emergencies B',nextSyllabus:'Complex Emergencies',startDate:'Sep 6'},
{id:'t3',name:'Dana Levi',initials:'DL',status:'Active',progress:76,totalFlights:25,instructedFlights:18,soloFlights:7,average:4.2,rank:2,currentSyllabus:'Basic Emergencies B',nextSyllabus:'Complex Emergencies',startDate:'Sep 6'},
{id:'t4',name:'Amit Barak',initials:'AB',status:'Active',progress:61,totalFlights:20,instructedFlights:17,soloFlights:3,average:3.9,rank:4,currentSyllabus:'Advanced Circuits',nextSyllabus:'Basic Emergencies A',startDate:'Sep 9'},
{id:'t5',name:'Lior Dayan',initials:'LD',status:'Inactive',progress:38,totalFlights:13,instructedFlights:13,soloFlights:0,average:null,rank:null,currentSyllabus:'Circuits',nextSyllabus:null,startDate:'Sep 10'}];
const instructors=[{id:'i1',name:'Or Fainguersch'},{id:'i2',name:'Nir Schneider'}];
const syllabi=['Basic Handling','Figure 8','Circuits','Touch & Go','Basic Emergencies A','Basic Emergencies B','Complex Emergencies','Complex Engine Emergencies','Pre-Test Preparation','Solo Certification Check'];
const criteria=[{id:'c1',name:'Flight path control',weight:.25},{id:'c2',name:'Work method',weight:.2},{id:'c3',name:'Airmanship',weight:.2},{id:'c4',name:'Emergency handling',weight:.2},{id:'c5',name:'Brief / debrief quality',weight:.15}];
const emergencies=['Engine cut','GEN malfunction','BAT malfunction','NO RPT','Stuck flaps','Flat tire / no fuel','Low clouds','Flight-box / IAS malfunction'];
const courseTypes=[{id:'EP',name:'EP'},{id:'IP',name:'IP'},{id:'TECHNICIAN',name:'TECHNICIAN'}];
const phaseTemplates=[
{id:'ep_rc',type:'EP',name:'RC Model'},
{id:'ep_half',type:'EP',name:'Half Scale'},
{id:'ep_full',type:'EP',name:'Full Scale'}
];
const trainingKinds=['New Training','Conversion','Flight Instructor Training'];
const dayNight=['Day','Night'];
const countries=['Israel','Cyprus'];
const currentCourseMeta={type:'EP',phase:'RC Model',trainingKind:'New Training',dayNight:'Day',country:'Israel'};
const syllProgress=[['Basic Handling',100,'Complete'],['Figure 8',100,'Complete'],['Circuits',100,'Complete'],['Emergencies',80,'Current'],['Final Preparation',0,'Next']];
const state={screen:'home',selectedTrainee:'t1',search:'',filter:'All',editingEval:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function getEvaluations(){try{return JSON.parse(localStorage.getItem('ct-review-evals')||'[]')}catch{return []}}function setEvaluations(x){try{localStorage.setItem('ct-review-evals',JSON.stringify(x))}catch{}}
const nav=[['home','⌂','Home'],['evaluation','✓','Evaluation'],['safety','◈','Safety'],['exams','▤','Exams'],['planned','▣','Planned vs Executed'],['__label','','COURSE'],['roster','♙','Course Roster'],['reports','▥','Reports'],['settings','⚙','Course Settings']];
function renderNav(){const n=$('#nav');n.innerHTML=nav.map(([id,ic,l])=>id==='__label'?'<div class="navLabel">'+l+'</div>':`<button class="navBtn ${state.screen===id?'active':''}" data-nav="${id}"><span>${ic}</span><span>${l}</span></button>`).join('');n.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));}
function go(screen,extra={}){Object.assign(state,extra,{screen});$('#drawer').classList.remove('open');render()}
$('#menuBtn').onclick=()=>$('#drawer').classList.add('open');$('#backdrop').onclick=()=>$('#drawer').classList.remove('open');
function metric(label,value,detail){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="detail">${detail||''}</div></div>`}
function home(){return `<section class="hero"><span class="pill blue">TRAINING OVERVIEW</span><h1>Aerostar EP Course</h1><p>RC / Simulator / Live Flights · Israel · Sep–Oct 2026</p><div class="courseMeta"><span class="pill blue">EP</span><span class="pill violet">RC Model</span><span class="pill green">New Training</span><span class="pill amber">Day</span><span class="pill gray">Israel</span></div></section>
<section class="grid metrics">${metric('Trainees','5','4 active · 1 inactive')}${metric('Planned Flights','136','72 completed')}${metric('Syllabus Progress','68%','Course on track')}${metric('Average Grade','4.2 / 5','+0.3 over 2 weeks')}${metric('Safety Events','2','0 currently open')}</section>
<div class="sectionHead"><h2>Operational activities</h2><p>Your daily training tools</p></div>
<section class="grid actions">
<button class="card action" data-go="evaluation"><div class="actionIcon" style="background:#2563eb">✓</div><div><b>Evaluation</b><small>Record and review flight evaluations</small></div><span class="arr">›</span></button>
<button class="card action" data-go="safety"><div class="actionIcon" style="background:#059669">◈</div><div><b>Safety</b><small>Report and manage safety events</small></div><span class="arr">›</span></button>
<button class="card action" data-go="exams"><div class="actionIcon" style="background:#7c3aed">▤</div><div><b>Theoretical Exams</b><small>Manage exams and trainee results</small></div><span class="arr">›</span></button>
<button class="card action" data-go="planned"><div class="actionIcon" style="background:#f97316">▣</div><div><b>Planned vs Executed</b><small>Plan training and record outcomes</small></div><span class="arr">›</span></button>
<button class="card action" data-go="roster"><div class="actionIcon" style="background:#0891b2">♙</div><div><b>Course Roster</b><small>Trainees and instructors in one place</small></div><span class="arr">›</span></button>
<button class="card action" data-go="reports"><div class="actionIcon" style="background:#4f46e5">▥</div><div><b>Reports</b><small>Progress, analytics and insights</small></div><span class="arr">›</span></button>
</section>`}
function evaluation(){const list=getEvaluations(),edit=state.editingEval?list.find(x=>x.id===state.editingEval):null;return `<div class="eyebrow">Evaluation workflow</div><h1 class="pageTitle">Evaluation</h1><p class="sub">Phase 2 mirror: weighted criteria, drafts, verified-save concept, revision history and exports are simulated locally.</p>
<div class="twoCol"><section class="card formCard"><div class="formTitle"><h2>${edit?`Edit evaluation · revision ${edit.revision}`:'New evaluation'}</h2><span class="pill amber" id="draftBadge">DRAFT · unsent</span></div>
<form id="evalForm">
<div class="fields">
<div class="field"><label>Trainee</label><select name="trainee" ${edit?'disabled':''}>${trainees.filter(t=>t.status==='Active').map(t=>`<option value="${t.id}" ${(edit?.traineeId||state.selectedTrainee)===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>
<div class="field"><label>Instructor</label><select name="instructor">${instructors.map(i=>`<option value="${i.id}" ${edit?.instructorId===i.id?'selected':''}>${i.name}</option>`).join('')}</select></div>
<div class="field"><label>Syllabus</label><select name="syllabus" ${edit?'disabled':''}>${syllabi.map(sy=>`<option ${edit?.syllabus===sy?'selected':''}>${sy}</option>`).join('')}</select></div>
<div class="field"><label>Duration</label><select name="duration">${[15,20,25,30,40].map(v=>`<option value="${v}" ${Number(edit?.duration||20)===v?'selected':''}>${v} min</option>`).join('')}</select></div>
<div class="field"><label>Date</label><input class="input" name="date" type="date" value="${edit?.flightDate||new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Time</label><input class="input" name="time" type="time" value="${edit?.time||'10:00'}"></div>

function cfgItem(list,id){return list.find(x=>x.id===id)}
function cfgResolve(sel){
  let best=null,score=-1;
  for(const p of cfgProfilesGet()){
    let ok=true,s=0;
    for(const k of ['courseType','phaseId','dayNight']){
      if(p[k]===sel[k])s+=4; else if(p[k]!=='*')ok=false;
    }
    for(const k of ['trainingKind','country']){
      if(p[k]===sel[k])s+=2; else if(p[k]!=='*')ok=false;
    }
    if(ok&&s>score){best=p;score=s}
  }
  return best;
}

    html+='<div class="field"><label>Course code</label><input class="input" name="code" required placeholder="CEP-27"></div>';
    html+='<div class="field"><label>Course type</label><select name="courseType" id="courseTypeSelect">'+c.courseTypes.map(x=>'<option value="'+x.id+'" '+(x.id===type?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>';
    html+='<div class="field"><label>Phase</label><select name="phase" id="phaseSelect">'+phases.map(x=>'<option value="'+x.id+'" '+(x.id===phase?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>';
    html+='<div class="field"><label>Training type</label><select name="trainingKind" id="builderTraining">'+c.trainingKinds.map(x=>'<option value="'+x.id+'" '+(x.id===training?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>';
    html+='<div class="field"><label>Day / Night</label><select name="dayNight" id="builderDay">'+c.dayNight.map(x=>'<option value="'+x.id+'" '+(x.id===time?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>';
    html+='<div class="field"><label>Country</label><select name="country" id="builderCountry">'+c.countries.map(x=>'<option value="'+x.id+'" '+(x.id===country?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>';
    html+='<div class="field"><label>Start date</label><input class="input" name="startsOn" type="date"></div></div>';
    html+='<div id="cfgResolvedPreview">'+cfgResolvedHtml(sel)+'</div><div class="toolbar"><button class="btn sky" type="submit" '+(phase?'':'disabled')+'>＋ Create as draft</button></div></form></section>';
    html+='<section class="card sideCard"><h3>Draft courses</h3><p class="sub">Each draft keeps a snapshot of the matched configuration.</p><div class="draftList">'+(created.length?created.map(x=>'<div class="draftCourse"><div class="inlineHead"><b>'+esc(x.name)+' · '+esc(x.code)+'</b><span class="pill amber">DRAFT</span></div><p>'+esc(x.summary||[x.courseType,x.phaseName,x.trainingKind,x.dayNight,x.country].filter(Boolean).join(' · '))+'</p><div class="profileMeta"><span class="pill blue">'+(x.syllabusCount||0)+' syllabi</span><span class="pill violet">'+(x.criteriaCount||0)+' criteria</span><span class="pill gray">'+(x.emergencyCount||0)+' emergencies</span></div></div>').join(''):'<p style="color:#64748b;font-size:12px">No local draft courses yet.</p>')+'</div></section></div>';
  }

  if(tab==='catalog'){
    html+='<div class="settingsGrid" style="margin-top:14px">';
    html+=cfgCatalogCard('Course types','courseTypes',c.courseTypes);
    html+=cfgPhaseCard(c);
    html+=cfgCatalogCard('Training types','trainingKinds',c.trainingKinds);
    html+=cfgCatalogCard('Day / Night','dayNight',c.dayNight);
    html+=cfgCatalogCard('Countries','countries',c.countries);
    html+=cfgCatalogCard('Syllabi','syllabi',c.syllabi);
    html+=cfgCriteriaCard(c.criteria);
    html+=cfgCatalogCard('Emergencies','emergencies',c.emergencies);
    html+='<section class="card settingBox"><h3>Catalog controls</h3><p class="sub">Rename keeps stable IDs. Removing an item may invalidate profiles that reference it.</p><div class="toolbar"><button class="btn sky" id="cfgSaveCatalogs">Save all edits</button><button class="btn danger" id="cfgResetCatalogs">Reset defaults</button></div></section></div>';
  }

  if(tab==='profiles'){
    const p=state.editProfileId?cfgProfilesGet().find(x=>x.id===state.editProfileId):null;
    html+='<div class="twoCol" style="margin-top:14px"><section class="card formCard"><div class="formTitle"><h2>'+(p?'Edit':'Create')+' configuration profile</h2><span class="pill blue">Selection → bundle</span></div>'+cfgProfileEditor(p,c)+'</section>';
    html+='<section class="card sideCard"><h3>Saved profiles</h3><p class="sub">Example: EP + Full Scale + Night immediately resolves to its assigned syllabus/criteria list.</p><div class="draftList">'+cfgProfilesGet().map(x=>cfgProfileCard(x,c)).join('')+'</div></section></div>';
  }
  return html;
}
function getPhaseTemplates(){try{return [...phaseTemplates,...JSON.parse(localStorage.getItem('ct-review-phases')||'[]')]}catch{return phaseTemplates}}
function getDraftCourses(){try{return JSON.parse(localStorage.getItem('ct-review-courses')||'[]')}catch{return []}}
function getSettings(){try{return JSON.parse(localStorage.getItem('ct-review-settings')||'{}')}catch{return {}}}function saveSettings(x){try{localStorage.setItem('ct-review-settings',JSON.stringify(x))}catch{}}
function placeholder(title,icon){return `<div class="eyebrow">Reserved workflow</div><h1 class="pageTitle">${title}</h1><section class="card empty"><div class="icon">${icon}</div><h3>Reserved for a later phase</h3><p>The route exists in the current codebase, but this iPhone review build does not simulate the backend workflow here.</p></section>`}
function reports(){return `<div class="eyebrow">Reports & analytics</div><h1 class="pageTitle">Course analytics</h1><p class="sub">Preview of the reporting direction; no production data is used.</p><section class="grid metrics">${metric('Course average','4.2','+0.3 trend')}${metric('Flights complete','72','of 136 planned')}${metric('Active trainees','4','1 inactive')}${metric('Open safety','0','2 historical')}</section><section class="card settingBox"><h3>Export-ready report ideas</h3><div class="editableList"><div class="editableRow"><span class="pill blue">01</span><input class="input" value="Trainee grade trend" readonly></div><div class="editableRow"><span class="pill violet">02</span><input class="input" value="Syllabus completion distribution" readonly></div><div class="editableRow"><span class="pill green">03</span><input class="input" value="Planned vs executed flights" readonly></div></div></section>`}
function render(){renderNav();let html='';switch(state.screen){case'home':html=home();break;case'evaluation':html=evaluation();break;case'roster':html=roster();break;case'profile':html=traineeProfile();break;case'settings':html=settings();break;case'reports':html=reports();break;case'safety':html=placeholder('Safety','◈');break;case'exams':html=placeholder('Exams','▤');break;case'planned':html=placeholder('Planned vs Executed','▣');break}$('#content').innerHTML=html;bind();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-trainee]').forEach(b=>b.onclick=()=>go('profile',{selectedTrainee:b.dataset.trainee}));document.querySelectorAll('[data-profile-tab]').forEach(b=>b.onclick=()=>{state.profileTab=b.dataset.profileTab;render()});document.querySelectorAll('[data-settings-tab]').forEach(b=>b.onclick=()=>{state.settingsTab=b.dataset.settingsTab;render()});document.querySelectorAll('[data-roster-type]').forEach(b=>b.onclick=()=>{state.rosterType=b.dataset.rosterType;render()});
if($('#rosterSearch')){$('#rosterSearch').oninput=e=>{state.search=e.target.value;clearTimeout(window._rs);window._rs=setTimeout(render,120)};$('#statusFilter').onchange=e=>{state.filter=e.target.value;render()};$('#addPersonBtn').onclick=()=>$('#personModal').classList.add('open');$('#closePersonModal').onclick=()=>$('#personModal').classList.remove('open');$('#personModal').onclick=e=>{if(e.target.id==='personModal')$('#personModal').classList.remove('open')};$('#addPersonForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget),type=fd.get('type');const arr=getRosterExtras();const name=String(fd.get('name'));arr.push({id:'x_'+Date.now(),name,email:String(fd.get('email')||''),type,status:'Active',initials:name.split(' ').map(x=>x[0]).join('').slice(0,2),average:type==='TRAINEE'?null:undefined,totalFlights:type==='TRAINEE'?0:undefined});localStorage.setItem('ct-review-roster',JSON.stringify(arr));toast(name+' added to the course');render()}}
if($('#backRoster'))$('#backRoster').onclick=()=>go('roster');if($('#evalForm'))bindEval();if(state.screen==='settings')bindSettings();document.querySelectorAll('[data-edit-eval]').forEach(b=>b.onclick=()=>{state.editingEval=b.dataset.editEval;render()});}
function bindEval(){const f=$('#evalForm');const scoreEls=[...f.querySelectorAll('select[name^="score_"]')];const recalc=()=>{let complete=true,total=0;criteria.forEach(c=>{const el=f.querySelector('[name="score_'+c.id+'"]'),v=Number(el?.value||0);if(!v)complete=false;total+=v*c.weight});$('#suggestedGrade').textContent=complete?(Math.round(total*10)/10).toFixed(1):'—'};scoreEls.forEach(x=>x.onchange=recalc);f.querySelectorAll('input,select,textarea').forEach(x=>x.onchange=()=>$('#draftBadge')?.classList.remove('hidden'));f.querySelectorAll('input[name="gradeMode"]').forEach(x=>x.onchange=()=>{$('#overrideWrap').style.display=x.value==='INSTRUCTOR'&&x.checked?'block':(f.querySelector('input[name="gradeMode"]:checked')?.value==='INSTRUCTOR'?'block':'none')});
$('#draftBtn').onclick=()=>toast('Draft saved locally');if($('#cancelEdit'))$('#cancelEdit').onclick=()=>{state.editingEval=null;render()};if($('#excelBtn'))$('#excelBtn').onclick=()=>{const rows=[['Date','Trainee','Instructor','Syllabus','Grade','Revision'],...getEvaluations().map(i=>[i.flightDate,i.traineeName,i.instructorName,i.syllabus,i.grade,i.revision])];const csv=rows.map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='course-evaluations.csv';a.click();URL.revokeObjectURL(a.href)};if($('#pdfBtn'))$('#pdfBtn').onclick=()=>window.print();
f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),list=getEvaluations(),old=state.editingEval?list.find(x=>x.id===state.editingEval):null,traineeId=old?.traineeId||fd.get('trainee'),instId=fd.get('instructor');const scores={};criteria.forEach(c=>scores[c.id]=Number(fd.get('score_'+c.id))||0);let suggested=0,complete=true;criteria.forEach(c=>{if(!scores[c.id])complete=false;suggested+=scores[c.id]*c.weight});suggested=complete?Math.round(suggested*10)/10:0;const gradeMode=fd.get('gradeMode')||'SUGGESTED';const grade=gradeMode==='INSTRUCTOR'?Number(fd.get('instructorGrade')||0):suggested;const obj={id:old?.id||'ev_'+Date.now(),revision:old?(old.revision||1)+1:1,revisionCount:old?(old.revisionCount||1)+1:1,traineeId,instructorId:instId,traineeName:trainees.find(t=>t.id===traineeId)?.name||'Trainee',instructorName:instructors.find(i=>i.id===instId)?.name||'Instructor',syllabus:old?.syllabus||fd.get('syllabus'),duration:Number(fd.get('duration')),flightDate:fd.get('date'),time:fd.get('time'),scores,suggestedGrade:suggested,gradeMode,grade,comments:fd.get('comments'),emphases:fd.get('emphases'),emergencies:emergencies.map((_,i)=>Number(fd.get('em_'+i))||0),changeReason:fd.get('changeReason')||''};const next=old?list.map(x=>x.id===old.id?obj:x):[obj,...list];setEvaluations(next);state.editingEval=null;toast(old?'Revision '+obj.revision+' saved and verified':'Evaluation saved and verified');render()}}

function bindSettings(){
  const c=cfgGet();
  const updateBuilder=()=>{
    const type=$('#courseTypeSelect')?.value||'',phase=$('#phaseSelect')?.value||'',training=$('#builderTraining')?.value||'',time=$('#builderDay')?.value||'',country=$('#builderCountry')?.value||'';
    state.builderType=type;state.builderPhase=phase;state.builderTraining=training;state.builderDay=time;state.builderCountry=country;
    const box=$('#cfgResolvedPreview'); if(box)box.innerHTML=cfgResolvedHtml({courseType:type,phaseId:phase,trainingKind:training,dayNight:time,country});
  };
  if($('#courseTypeSelect'))$('#courseTypeSelect').onchange=e=>{
    const list=c.phases.filter(x=>x.type===e.target.value);state.builderType=e.target.value;state.builderPhase=list[0]?.id||'';
    $('#phaseSelect').innerHTML=list.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');updateBuilder();
  };
  ['phaseSelect','builderTraining','builderDay','builderCountry'].forEach(id=>{if($('#'+id))$('#'+id).onchange=updateBuilder});
  if($('#courseBuilder'))$('#courseBuilder').onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.currentTarget),sel={courseType:String(fd.get('courseType')),phaseId:String(fd.get('phase')),trainingKind:String(fd.get('trainingKind')),dayNight:String(fd.get('dayNight')),country:String(fd.get('country'))};
    const p=cfgResolve(sel),cc=cfgGet(),ct=cfgItem(cc.courseTypes,sel.courseType),ph=cfgItem(cc.phases,sel.phaseId),tk=cfgItem(cc.trainingKinds,sel.trainingKind),dn=cfgItem(cc.dayNight,sel.dayNight),co=cfgItem(cc.countries,sel.country),arr=getDraftCourses();
    arr.unshift({id:cfgId('course'),name:String(fd.get('name')),code:String(fd.get('code')),summary:[ct?.name,ph?.name,tk?.name,dn?.name,co?.name].filter(Boolean).join(' · '),startsOn:String(fd.get('startsOn')||''),profileId:p?.id||null,syllabusCount:p?.syllabusIds.length||0,criteriaCount:p?.criteriaIds.length||0,emergencyCount:p?.emergencyIds.length||0,snapshot:p?JSON.parse(JSON.stringify(p)):null});
    localStorage.setItem('ct-review-courses',JSON.stringify(arr));toast(p?'Draft created with matched configuration':'Draft created — no matching profile');render();
  };

  if($('#phaseScope'))$('#phaseScope').onchange=e=>{state.phaseScope=e.target.value;render()};

  if($('#cfgSaveCatalogs'))$('#cfgSaveCatalogs').onclick=()=>{
    const cc=cfgGet();
    document.querySelectorAll('.cfgName').forEach(el=>{const x=cc[el.dataset.kind]?.find(v=>v.id===el.dataset.id);if(x&&el.value.trim())x.name=el.value.trim()});
    document.querySelectorAll('.cfgPhaseName').forEach(el=>{const x=cc.phases.find(v=>v.id===el.dataset.id);if(x&&el.value.trim())x.name=el.value.trim()});
    document.querySelectorAll('.cfgCriterionName').forEach(el=>{const x=cc.criteria.find(v=>v.id===el.dataset.id);if(x&&el.value.trim())x.name=el.value.trim()});
    document.querySelectorAll('.cfgCriterionWeight').forEach(el=>{const x=cc.criteria.find(v=>v.id===el.dataset.id);if(x)x.weight=Math.max(0,Math.min(100,Number(el.value)||0))});
    cfgSave(cc);toast('All catalog changes saved');render();
  };

  document.querySelectorAll('.cfgAddForm').forEach(form=>form.onsubmit=e=>{
    e.preventDefault();const cc=cfgGet(),kind=form.dataset.kind,name=String(new FormData(form).get('name')||'').trim();if(!name)return;
    const prefix={courseTypes:'type',trainingKinds:'training',dayNight:'time',countries:'country',syllabi:'syllabus',emergencies:'emergency'}[kind]||'item';
    cc[kind].push({id:cfgId(prefix),name});cfgSave(cc);toast(name+' added');render();
  });

  document.querySelectorAll('[data-cfg-remove]').forEach(btn=>btn.onclick=()=>{
    const parts=btn.dataset.cfgRemove.split('|'),kind=parts[0],id=parts[1],cc=cfgGet();cc[kind]=cc[kind].filter(x=>x.id!==id);
    if(kind==='courseTypes')cc.phases=cc.phases.filter(x=>x.type!==id);cfgSave(cc);toast('Catalog item removed');render();
  });

  document.querySelectorAll('[data-phase-remove]').forEach(btn=>btn.onclick=()=>{const cc=cfgGet();cc.phases=cc.phases.filter(x=>x.id!==btn.dataset.phaseRemove);cfgSave(cc);toast('Phase removed');render()});
  if($('#cfgAddPhase'))$('#cfgAddPhase').onsubmit=e=>{
    e.preventDefault();const cc=cfgGet(),name=String(new FormData(e.currentTarget).get('name')||'').trim(),type=state.phaseScope||cc.courseTypes[0]?.id||'';if(!name||!type)return;
    cc.phases.push({id:cfgId('phase'),type,name});cfgSave(cc);toast(name+' phase added');render();
  };

  document.querySelectorAll('[data-criterion-remove]').forEach(btn=>btn.onclick=()=>{const cc=cfgGet();cc.criteria=cc.criteria.filter(x=>x.id!==btn.dataset.criterionRemove);cfgSave(cc);toast('Criterion removed');render()});
  if($('#cfgAddCriterion'))$('#cfgAddCriterion').onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.currentTarget),name=String(fd.get('name')||'').trim(),weight=Math.max(0,Math.min(100,Number(fd.get('weight'))||0));if(!name)return;
    const cc=cfgGet();cc.criteria.push({id:cfgId('criterion'),name,weight});cfgSave(cc);toast('Criterion added');render();
  };

  if($('#cfgResetCatalogs'))$('#cfgResetCatalogs').onclick=()=>{if(confirm('Reset every master catalog to its default values?')){localStorage.removeItem('ct-review-catalogs');state.phaseScope=null;toast('Catalogs reset to defaults');render()}};

  if($('#cfgProfileType'))$('#cfgProfileType').onchange=e=>{const cc=cfgGet(),list=cc.phases.filter(x=>x.type===e.target.value);$('#cfgProfilePhase').innerHTML=list.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')};
  if($('#cfgProfileForm'))$('#cfgProfileForm').onsubmit=e=>{
    e.preventDefault();const fd=new FormData(e.currentTarget),arr=cfgProfilesGet(),old=state.editProfileId?arr.find(x=>x.id===state.editProfileId):null;
    const obj={id:old?.id||cfgId('profile'),name:String(fd.get('name')),courseType:String(fd.get('courseType')),phaseId:String(fd.get('phaseId')),trainingKind:String(fd.get('trainingKind')),dayNight:String(fd.get('dayNight')),country:String(fd.get('country')),syllabusIds:fd.getAll('syllabusIds').map(String),criteriaIds:fd.getAll('criteriaIds').map(String),emergencyIds:fd.getAll('emergencyIds').map(String)};
    cfgProfilesSave(old?arr.map(x=>x.id===old.id?obj:x):[...arr,obj]);state.editProfileId=null;toast(old?'Configuration profile updated':'Configuration profile created');render();
  };
  if($('#cfgProfileCancel'))$('#cfgProfileCancel').onclick=()=>{state.editProfileId=null;render()};
  document.querySelectorAll('[data-profile-edit]').forEach(btn=>btn.onclick=()=>{state.editProfileId=btn.dataset.profileEdit;render()});
  document.querySelectorAll('[data-profile-delete]').forEach(btn=>btn.onclick=()=>{cfgProfilesSave(cfgProfilesGet().filter(x=>x.id!==btn.dataset.profileDelete));if(state.editProfileId===btn.dataset.profileDelete)state.editProfileId=null;toast('Profile deleted');render()});
}

render();
</script>
